[package]
name = "planexpo-elm"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
rustyline = { version = "18.0.1", default-features = false }
serde = "1"
serde_json = { version = "1", features = ["raw_value"] }
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1

[target."cfg(unix)".dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
signal-hook = "0.3.18"
