name: CI and release
# Every push and pull request builds and tests the five release binaries and
# assembles the npm tarball. Pushing a tag `v<version>` additionally publishes
# that exact tarball to npm (through the `npm-publish` environment, restricted
# to v* tags) and attaches it, with the raw binaries, to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, package: linux-x64}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, package: linux-arm64}
          - {os: macos-14, target: x86_64-apple-darwin, package: darwin-x64}
          - {os: macos-14, target: aarch64-apple-darwin, package: darwin-arm64}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, package: win32-x64}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --target ${{ matrix.target }}
      - run: cargo +1.98.1 test --locked --no-fail-fast
      - run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      # pinned.test.mjs checks Planexpo's Makefile, outside the standalone repo.
      - run: node --test distribution/package.test.mjs
      - run: cargo +1.98.1 build --locked --release --target ${{ matrix.target }}
      - run: |
          mkdir -p artifacts/${{ matrix.package }}
          cp target/${{ matrix.target }}/release/planexpo-elm${{ matrix.package == 'win32-x64' && '.exe' || '' }} artifacts/${{ matrix.package }}/
      - run: artifacts/${{ matrix.package }}/planexpo-elm${{ matrix.package == 'win32-x64' && '.exe' || '' }} --compiler-help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: artifacts/
  package:
    needs: binaries
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: node distribution/stage-release.mjs artifacts release
      - run: chmod +x release/platforms/*/planexpo-elm*
      - run: node release/verify.cjs
      - run: node release/bin/planexpo-elm.cjs --version
      - run: npm pack ./release
      # Smoke test: install the tarball in an empty project and compile an Elm program.
      - run: |
          mkdir -p smoke/src && cd smoke && npm init -y >/dev/null
          npm install --no-audit --no-fund ../*.tgz
          npx planexpo-elm --version
          printf '{"type":"application","source-directories":["src"],"elm-version":"0.19.1","dependencies":{"direct":{"elm/core":"1.0.5","elm/html":"1.0.0"},"indirect":{"elm/json":"1.1.3","elm/virtual-dom":"1.0.3"}},"test-dependencies":{"direct":{},"indirect":{}}}' > elm.json
          printf 'module Main exposing (main)\nimport Html\nmain = Html.text "smoke"\n' > src/Main.elm
          npx planexpo-elm make src/Main.elm --output=main.js
          grep -q smoke main.js
      - run: |
          version="${GITHUB_REF_NAME//\//-}"
          for dir in release/platforms/*/; do
            platform=$(basename "$dir")
            tar -czf "planexpo-elm-$version-$platform.tar.gz" -C "$dir" .
          done
          sha256sum *.tgz planexpo-elm-*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: |
            *.tgz
            planexpo-elm-*.tar.gz
            SHA256SUMS
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Versions with a pre-release suffix (0.3.0-beta.1) go to the `next` dist-tag.
      - run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          # npm only accepts provenance statements from public repositories.
          provenance=""
          [ "${{ github.event.repository.private }}" = "false" ] && provenance="--provenance"
          npm publish ./*.tgz --access public $provenance --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes $flags ./*.tgz planexpo-elm-*.tar.gz SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
